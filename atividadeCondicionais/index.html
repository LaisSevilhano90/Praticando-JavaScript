<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Condicionais</title>
</head>
<body>
    <div class="atv1">
        <h1>Nivel Básico</h1>
        <h2>Exercicio 1</h2>
        <p>Qual sua idade?</p>
        <input type="number" min="1" max="100" id="idadeInput">
        <button onclick="verificarIdade()">Verificar</button>
    </div>
    <div class="atv1">
        <h2>Exercicio 2</h2>
        <p>Insira um número</p>
        <input type="number" min="1" max="100" id="posOuNegInput">
        <button onclick="posOuNeg()">Verificar</button>
    </div>
    <div class="atv1">
        <h2>Exercicio 3</h2>
        <p>Qual nota?</p>
        <input type="number" min="1" max="100" id="notaInput">
        <button onclick="verificarNota()">Verificar</button>
    </div>
    <div class="atv1">
        <h2>Exercicio 4</h2>
        <p>Insira um número</p>
        <input type="number" min="1" max="100" id="numberInput">
        <button onclick="verificarNumber()">Verificar</button>
    </div>
    <div class="atv1">
        <h2>Exercicio 5</h2>
        <p>Insira uma idade</p>
        <input type="number" min="1" max="100" id="classificacaoInput">
        <button onclick="classificacaoIdade()">Verificar</button>
    </div>
    <div class="atv1">
        <h2>Exercicio 6</h2>
        <p>Insira um número</p>
        <input type="number" min="1" max="100" id="parImparInput">
        <button onclick="imparOuPar()">Verificar</button>
    </div>
    
    <script src="../atividadeCondicionais/atvCond.js"></script>
</body>
</html>
